name: SonarQube

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: VNBrokers.sln
  TEST_RESULTS_DIR: artifacts/test-results
  COVERAGE_OUTPUT: artifacts/coverage/

jobs:
  unit-tests:
    name: Unit tests with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.sln', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "$SOLUTION_FILE" --locked-mode || dotnet restore "$SOLUTION_FILE"

      - name: Build with warnings as errors
        run: dotnet build "$SOLUTION_FILE" --configuration Release --no-restore -warnaserror

      - name: Test with coverage
        run: |
          dotnet test "$SOLUTION_FILE" \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory "$TEST_RESULTS_DIR" \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura

      - name: Collect coverage artifact
        run: |
          set -euo pipefail
          mkdir -p "$COVERAGE_OUTPUT"
          opencover_report="$(find "$TEST_RESULTS_DIR" -name coverage.opencover.xml -print -quit)"
          cobertura_report="$(find "$TEST_RESULTS_DIR" -name coverage.cobertura.xml -print -quit)"
          test -n "$opencover_report"
          cp "$opencover_report" "$COVERAGE_OUTPUT/coverage.opencover.xml"
          if [[ -n "$cobertura_report" ]]; then
            cp "$cobertura_report" "$COVERAGE_OUTPUT/coverage.cobertura.xml"
          fi
          ls -al $COVERAGE_OUTPUT

      - name: Upload test results
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-coverage
          path: ${{ env.COVERAGE_OUTPUT }}
          if-no-files-found: warn
          retention-days: 1

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8 # v8.0.1
        with:
          name: unit-test-coverage
          path: .

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarQube Scan
        run: mise run sonar
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
