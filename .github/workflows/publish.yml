name: Publish

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      package_version:
        description: NuGet package version to publish. Defaults to tag version or the project Version.
        required: false
        type: string
      publish_to_nuget:
        description: Push package to nuget.org using NUGET_API_KEY.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_PROJECT: src/VNBrokers/VNBrokers.csproj
  PACKAGE_OUTPUT: artifacts/packages

jobs:
  build:
    name: Build, pack, and publish
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.sln', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore VNBrokers.sln --locked-mode || dotnet restore VNBrokers.sln

      - name: Build
        run: dotnet build VNBrokers.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test VNBrokers.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Pack NuGet package
        run: >-
          dotnet pack "$PACKAGE_PROJECT"
          --configuration Release
          --no-build
          --output "$PACKAGE_OUTPUT"
          -p:PackageVersion=${{ steps.get_version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnbrokers-dotnet-${{ steps.get_version.outputs.version }}
          path: |
            ${{ env.PACKAGE_OUTPUT }}/*.nupkg
            artifacts/test-results/**/*.trx
          if-no-files-found: error
          retention-days: 5

  publish:
    name: "Publish"
    if: startsWith(github.ref, 'refs/tags/')
    needs: ["build"]
    permissions:
      contents: read
      id-token: write
    runs-on: "ubuntu-latest"
    environment:
      name: "production"

    steps:
      - name: "Download build pack"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: "${{ env.PACKAGE_OUTPUT }}/"

      - name: NuGet login (Trusted publishing)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to NuGet
        run: >
          dotnet nuget push "${{ env.PACKAGE_OUTPUT }}/*.nupkg"
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  publish-test:
    name: "Publish"
    if: github.event_name == 'workflow_dispatch'
    needs: ["build"]
    permissions:
      contents: read
      id-token: write
    runs-on: "ubuntu-latest"
    environment:
      name: "development"

    steps:
      - name: "Download build pack"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: "${{ env.PACKAGE_OUTPUT }}/"

      - name: NuGet login (Trusted publishing)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to NuGet
        run: >
          dotnet nuget push "${{ env.PACKAGE_OUTPUT }}/*.nupkg"
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source https://apiint.nugettest.org/v3/index.json
          --skip-duplicate
